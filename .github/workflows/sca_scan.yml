name: SCA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


permissions:
  contents: read
jobs:
  snyk-cli:
    uses: auth0/devsecops-tooling/.github/workflows/sca-scan.yml@e29f26478db18ff0bcbe4bc447a8fbd54fbeec9e # main on 2026-11-27, TODO: use a release instead
    with:
      pre-scan-commands: "npm ci"
      additional-arguments: "--exclude=README.md"
      node-version: 24
    secrets: inherit
